# pet.lvlove.wang: the classroom build, served from the release `current` points at.
# Installed as /etc/nginx/sites-available/pet-lvlove; certbot (--nginx) adds the 443 server
# and the HTTP → HTTPS redirect on first install, so the live file differs from this one.
server {
    listen 80;
    listen [::]:80;
    server_name pet.lvlove.wang;

    root /var/www/pet.lvlove.wang/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed bundles never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # The service worker and the page must be revalidated, or open tabs never see a new build.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(png|jpe?g|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    # Scene routes (/oscilloscope, …) are client-side: everything else is the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    access_log /var/log/nginx/pet.lvlove.wang.access.log;
    error_log /var/log/nginx/pet.lvlove.wang.error.log;
}
